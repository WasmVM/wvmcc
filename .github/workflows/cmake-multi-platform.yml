name: CMake on multiple platforms

on:
  push:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Build & Test
    concurrency:
      group: cmake-build-${{ github.ref }}-${{ matrix.os }}-${{ matrix.build_type }}
      cancel-in-progress: true
    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, macos-14]
        build_type: [Release]
        c_compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            parallel: 6
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            parallel: 6
          - os: macos-14
            c_compiler: clang
            cpp_compiler: clang++
            parallel: 4
        exclude:
          - os: macos-14
            c_compiler: gcc

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
        key: ${{ runner.os }}-ccache-${{ matrix.cpp_compiler }}-${{ matrix.c_compiler }}-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Cache CMake build dir
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build
        key: ${{ runner.os }}-cmake-build-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Install minimal build tools
      run: |
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          sudo apt-get update
          sudo apt-get install -y ccache cmake ninja-build build-essential
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          brew update
          brew install ccache cmake ninja || true
        fi

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install WasmVM
      uses: WasmVM/install-action@main
      with:
        token: ${{secrets.GITHUB_TOKEN}}
        dev: true

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -j ${{matrix.parallel}}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Upload build/test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}-${{ matrix.build_type }}
        path: ${{ steps.strings.outputs.build-output-dir }}
