# Continuous Integration for wvmcc (issue #36).
#
# Three stages run on every push to `parser` and every merge request to `master`:
#   build    — configure + compile wvmcc (and the libc runtime) with Ninja
#   test     — run the full ctest suite (unit + e2e integration)
#   validate — re-validate every .wasm module the integration tests emitted
#
# wvmcc depends on WasmVM (headers + libWasmVM + the wasmvm/readwasm/ar/ld
# tools). WasmVM ships no CI image, so the pipeline builds it from source once
# and caches the install prefix across pipelines (see the `default.before_script`
# below). On a cache hit that step is skipped and the whole pipeline stays well
# under the 5-minute budget.

stages:
  - build
  - test
  - validate

variables:
  # Branch/tag of wasmvm/wasmvm to build against. Bump to invalidate the cache
  # and pick up a newer WasmVM. (git clone --branch takes a ref name, not a SHA.)
  WASMVM_REF: "master"
  WASMVM_PREFIX: "$CI_PROJECT_DIR/.wasmvm"
  DEBIAN_FRONTEND: "noninteractive"
  GIT_DEPTH: "0"

# Run on: MRs targeting master, and pushes to parser / master. The middle rule
# suppresses the redundant branch pipeline while an MR for that branch is open,
# so we never get two pipelines for one change.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "parser"'
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'

default:
  image: ubuntu:22.04
  # The WasmVM install prefix is cached across pipelines, keyed on WASMVM_REF.
  # before_script rebuilds it on a cache miss, so the cache is purely a speedup
  # and never a correctness dependency.
  cache:
    - key: "wasmvm-$WASMVM_REF"
      paths:
        - .wasmvm/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        gcc g++ cmake ninja-build binutils git ca-certificates
    # Build + install WasmVM only if the cached prefix is absent.
    - |
      if [ ! -x "$WASMVM_PREFIX/bin/readwasm" ]; then
        echo "WasmVM not cached — building '$WASMVM_REF' from source"
        rm -rf /tmp/wasmvm-src
        git clone --depth=1 --branch "$WASMVM_REF" \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@git.luishsu.me/wasmvm/wasmvm.git" \
          /tmp/wasmvm-src
        cmake -S /tmp/wasmvm-src -B /tmp/wasmvm-src/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DDEV_BUILD=ON \
          -DCMAKE_INSTALL_PREFIX="$WASMVM_PREFIX"
        ninja -C /tmp/wasmvm-src/build
        ninja -C /tmp/wasmvm-src/build install
        rm -rf /tmp/wasmvm-src
      else
        echo "Using cached WasmVM at $WASMVM_PREFIX"
      fi
    # Put the WasmVM tools on PATH (wvmcc's integration tests find `wasmvm`, and
    # the validate stage uses `readwasm`) and its shared lib on the loader path.
    - export PATH="$WASMVM_PREFIX/bin:$PATH"
    - export LD_LIBRARY_PATH="$WASMVM_PREFIX/lib:${LD_LIBRARY_PATH:-}"

build:
  stage: build
  # Fail fast instead of burning the runner if a compile ever hangs again.
  timeout: 25m
  # build/ is handed to later stages via `artifacts` (the reliable cross-stage
  # mechanism — it also carries the emitted .wasm to validate). The `cache` entry
  # is an additional cross-pipeline speedup for incremental rebuilds.
  cache:
    - key: "wasmvm-$WASMVM_REF"
      paths:
        - .wasmvm/
    - key: "build-$CI_COMMIT_REF_SLUG"
      paths:
        - build/
  script:
    # The unit tests recompile the heavy TUs (Parser/Preprocessor/codegen) once
    # per test target — 660 objects total. At -O3 with unbounded parallelism GCC
    # OOM-thrashes/stalls on a constrained runner, so build wvmcc at -O1 (keeping
    # NDEBUG) and cap ninja to 2 jobs to bound peak memory. wvmcc only has to
    # compile tiny test C programs, so its own -O level is irrelevant to runtime.
    - JOBS=$(nproc 2>/dev/null || echo 2); if [ "$JOBS" -gt 2 ]; then JOBS=2; fi
    - cmake -B build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG"
        -DCMAKE_PREFIX_PATH="$WASMVM_PREFIX"
    - ninja -C build -j "$JOBS"
  artifacts:
    paths:
      - build/
    expire_in: 1 day
    when: always

test:
  stage: test
  needs: ["build"]
  cache:
    - key: "wasmvm-$WASMVM_REF"
      paths:
        - .wasmvm/
    - key: "build-$CI_COMMIT_REF_SLUG"
      paths:
        - build/
  script:
    # ctest exits non-zero on any failed test, which fails the job and the
    # pipeline — so a deliberately broken test cannot silently pass.
    - ctest --test-dir build --output-on-failure --output-junit ctest-report.xml
  artifacts:
    # Re-export build/ so `validate` sees the .wasm modules the e2e tests wrote.
    paths:
      - build/
    reports:
      junit: build/ctest-report.xml
    expire_in: 1 day
    when: always

validate:
  stage: validate
  needs: ["test"]
  script:
    # readwasm runs module_validate() by default (only --force skips it) and
    # exits non-zero on an invalid module. Validate every module the tests
    # produced; fail if any is invalid, or if none were produced at all.
    - |
      set -eu
      count=0
      fail=0
      for wasm in $(find build -name '*.wasm' | sort); do
        count=$((count + 1))
        printf '→ readwasm %s\n' "$wasm"
        if readwasm "$wasm" > /dev/null; then
          echo '  valid'
        else
          echo '  INVALID'
          fail=1
        fi
      done
      echo "validated $count module(s)"
      [ "$count" -gt 0 ] || { echo 'no .wasm modules found — nothing to validate'; exit 1; }
      [ "$fail" -eq 0 ] || { echo 'one or more modules failed validation'; exit 1; }
